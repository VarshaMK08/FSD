<!DOCTYPE html>
<html>

<head>
    <style>
        table {
            width: 25%;
            border-collapse: collapse;
        }

        th,
        td {
            padding: 10px 20px;
            /* top-bottom left-right */
            border: 1px solid black;
        }
    </style>
</head>

<body>

    <h2>Basic HTML Table</h2>

    <table>
        <tr>
            <th>First Name</th>
            <th>Last Name</th>
            <th>Age</th>
        </tr>

        <tr>
            <td>RajaRajeshwari</td>
            <td>G S</td>
            <td>20</td>
        </tr>

        <tr>
            <td>Spoorthi</td>
            <td>N</td>
            <td>20</td>
        </tr>

        <tr>
            <td>Varsha</td>
            <td>M K</td>
            <td>20</td>
        </tr>

        <tr>
            <td>rowspan="2</td>
            <td>M K</td>
            <td>20</td>
        </tr>

    </table>

</body>

</html>

<!DOCTYPE html>
<html>

<head>
    <title>
        Arithmetic Operation
    </title>
</head>

<body>
    <script>
        let a = 5;
        let b = 11;
        let c = 33;
        let d = a + b;
        let e = c % b;
        let f = a * a;

        console.log(a);
        console.log(b);
        console.log(c);
        console.log(d);
        console.log(e);
        console.log(f);
    </script>
</body>

</html>

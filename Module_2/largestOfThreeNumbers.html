<!DOCTYPE html>
<html>

<body>
    <script>
        let a = prompt("Enter the 1st number");
        let b = prompt("Enter the 2nd number");
        let c = prompt("Enter the 3rd number");

        if (a > b && a > c) {
            document.write("The largest number is " + a);
        }
        else if (b > a && b > c) {
            document.write("The largest number is " + b);
        }
        else {
            document.write("The largest number is " + c);
        }

    </script>
</body>

</html>

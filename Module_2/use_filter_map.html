<!-- create an array of objects representing students. Use filter() and map() together to get the names of students who scored more than 50 -->

<!DOCTYPE html>
<html>
<body>
    <h2>Students Scores</h2>
    <script>
        const students = [
            { name: "Asha", score: 70 },
            { name: "Nikhil", score: 45 },
            { name: "Riya", score: 65 },
            { name: "Kabir", score: 52 },
            { name: "Meera", score: 30 }
        ];

        document.write("All students: ");
        students.forEach(student => {
            document.write(student.name + " (" + student.score + ")<br>");
        });

        const names = students
            .filter(student => student.score > 50)
            .map(student => student.name);

        document.write("<br>Students who scored more than 50: " + names);
    </script>
</body>
</html>

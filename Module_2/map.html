<!-- Create an array of numbers,use map() with an arrow function 
 to return a new array with each number doubled -->

<!DOCTYPE html>
<html>

<body>
    <h2>Double the Numbers in an Array</h2>
    <p>Original Array: [1, 2, 3, 4, 5]</p>
    <p id="doubledArray"></p>

    <script>
        const num = [1,2,3,4,5];
        const doubled = num.map(n => n*2);
        document.getElementById("doubledArray").innerHTML = "Doubled Array: [" + doubled + "]";
    </script>

</body>

</html>

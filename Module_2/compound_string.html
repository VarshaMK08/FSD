<!DOCTYPE html>
<html>

<head>
    <title>
        Compound and String Operation
    </title>
</head>


<body>
    <script>

        //String concatination
        let firstName = "Varsha";
        let lastName = "M K";

        let fullName = firstName + " " + lastName;
        console.log("Full Name: ", fullName);

        //Compound assignment
        let a = 5;
        console.log("a = ", a);
        a += 3;
        console.log("a += 3 => ", a);
    </script>
</body>

</html>

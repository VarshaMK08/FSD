<!-- Write a JavaScript program to accept a number from the user (1–7) and display the corresponding day using a switch statement.

Example:

Input: 1
Output: Monday

If the user enters a number other than 1–7, display "Invalid Day". -->

<!DOCTYPE html>
<html>

<body>
    <button onclick="switchfun()">Check day</button>
    <script>
        function switchfun() {
            var day = prompt("Enter the number between 1 to 7");
            switch (day) {
                case "1":
                    alert("Monday");
                    break;
                case "2":
                    alert("Tuesday");
                    break;
                case "3":
                    alert("Wednesday");
                    break;
                case "4":
                    alert("Thursday");
                    break;
                case "5":
                    alert("Friday");
                    break;
                case "6":
                    alert("Saturday");
                    break;
                case "7":
                    alert("Sunday");
                    break;
                default:
                    alert("Invalid Day");


            }
        }
    </script>
</body>

</html>

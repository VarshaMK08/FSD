<!-- Write a JavaScript program to accept the marks of a student from the user and display the corresponding grade using an if–else-if–else statement.

The grading criteria are:

Marks	Grade
90–100	A+
80–89	A
70–79	B
60–69	C
40–59	D
Below 40	F 
-->

<!DOCTYPE html>
<html>

<body>

    <h2>Student Grade Calculation</h2>
    <form>
        <label for="marks">Enter the marks: </label>
        <input type="number" id="marks" name="marks" required>
        <input type="submit" value="Submit" id="submit">
    </form>
    <p id="grade"></p>

    <script>
        document.getElementById("submit").addEventListener("click", function (event) {
            event.preventDefault();

            var marks = document.getElementById("marks").value;
            var grade;

            if (marks >= 90 && marks <= 100) {
                grade = "A+";
            }
            else if (marks >= 80 && marks <= 89) {
                grade = "A";
            }
            else if (marks >= 70 && marks <= 79) {
                grade = "B";
            }
            else if (marks >= 60 && marks <= 69) {
                grade = "C";
            }
            else if (marks >= 40 && marks <= 59) {
                grade = "D";
            }
            else {
                grade = "F";
            }
            document.getElementById("grade").innerHTML = "Grade: " + grade;
        })
    </script>
</body>

</html>

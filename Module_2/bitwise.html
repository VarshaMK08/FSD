<!DOCTYPE html>
<html>

<head>
    <title>
        Bitwise Operation
    </title>
</head>


<body>
    <script>
        let a = 5;
        let b = 3;

        console.log("a & b = " + (a & b));
        console.log("a | b = " + (a | b));
        console.log("a ^ b = " + (a ^ b));
        console.log("~a = " + ~a);
        console.log("a << 1 = " + (a << 1));
        console.log("a >> 1 = " + (a >> 1));
    </script>
</body>

</html>
